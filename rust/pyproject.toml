[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "django-matt-rust"
version = "0.1.0"
description = "Rust-accelerated hot paths for django-matt"
requires-python = ">=3.12"
license = { text = "MIT" }

[tool.maturin]
module-name = "django_matt._rust"
python-source = "python"
features = ["pyo3/extension-module"]
