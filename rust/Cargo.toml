[package]
name = "django_matt_rust"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Rust-accelerated hot paths for django-matt"

[lib]
name = "_rust"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.25", features = ["extension-module"] }
hmac = "0.12"
sha2 = { version = "0.10", features = ["oid"] }
subtle = "2.6"
base64 = "0.22"
ryu = "1.0"
rsa = "0.9"
p256 = "0.13"
p384 = "0.13"
ecdsa = { version = "0.16", features = ["signing", "verifying"] }
pkcs8 = { version = "0.10", features = ["pem"] }
signature = "2.2"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = 3
