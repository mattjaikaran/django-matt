repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=500']
      - id: check-merge-conflict

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.6
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

# Run django-matt's AI-powered code audit (security, performance, best practices)
# Only triggers when Python files are staged. To skip: SKIP=matt-audit git commit
  - repo: local
    hooks:
      - id: matt-audit
        name: Django Matt AI Audit
        entry: .pre-commit-hooks/matt-audit.sh
        language: script
        files: \.py$
        stages: [commit]
        pass_filenames: false
        always_run: false
