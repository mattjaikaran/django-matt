[project]
name = "{{ project_name }}"
version = "0.1.0"
description = "Blog API built with django-matt"
requires-python = ">=3.12"
dependencies = [
    "django>=5.2",
    "django-matt[auth]",
    "django-cors-headers>=4.0",
    "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-django>=4.8",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
asyncio_mode = "auto"
