name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv python install 3.12
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  test:
    runs-on: ubuntu-latest
    needs: [lint]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv python install 3.12
      - run: uv sync --frozen
      env:
        DATABASE_URL: postgres://postgres:postgres@localhost:5432/test_db
      - run: uv run pytest --cov --cov-report=xml
      - uses: codecov/codecov-action@v4
        if: always()
        with:
          file: ./coverage.xml

  security:
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv python install 3.12
      - run: uv sync --frozen
      - run: uv run bandit -c pyproject.toml -r django_matt/ || true
      - run: uv run pip-audit || true

  gauntlet:
    name: Gauntlet (Quality Gate)
    runs-on: ubuntu-latest
    needs: [lint, test]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv python install 3.12
      - run: uv sync --frozen
      env:
        DATABASE_URL: postgres://postgres:postgres@localhost:5432/test_db
      - run: uv run python scripts/gauntlet.py --ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gauntlet-report
          path: gauntlet-report.json

  examples:
    name: Example Apps
    runs-on: ubuntu-latest
    needs: [lint]
    strategy:
      fail-fast: false
      matrix:
        app: [quicktodo, ecommerce-v2, devplatform, saas-starter, ecommerce-api, blog-app, portfolio-api]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv python install 3.12
      - run: cd examples/${{ matrix.app }} && uv sync && uv run python manage.py check
