name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: "1"
  FORCE_COLOR: "1"

jobs:
  build-python:
    name: Build Python Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.13

      - name: Build package
        run: uv build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-python
          path: dist/

  build-rust-linux:
    name: Rust Wheels (Linux ${{ matrix.target }}, Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64, aarch64]
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - name: Build manylinux wheel
        uses: PyO3/maturin-action@v1
        with:
          working-directory: rust
          target: ${{ matrix.target }}
          args: --release --out dist --interpreter python${{ matrix.python-version }}
          manylinux: auto

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: dist-rust-linux-${{ matrix.target }}-py${{ matrix.python-version }}
          path: rust/dist/*.whl

  build-rust-macos:
    name: Rust Wheels (macOS ${{ matrix.target }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.target == 'aarch64-apple-darwin' && 'macos-14' || 'macos-13' }}
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-apple-darwin, aarch64-apple-darwin]
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          working-directory: rust
          target: ${{ matrix.target }}
          args: --release --out dist

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: dist-rust-macos-${{ matrix.target }}-py${{ matrix.python-version }}
          path: rust/dist/*.whl

  build-rust-windows:
    name: Rust Wheels (Windows, Python ${{ matrix.python-version }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          working-directory: rust
          target: x86_64-pc-windows-msvc
          args: --release --out dist

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: dist-rust-windows-py${{ matrix.python-version }}
          path: rust/dist/*.whl

  build-rust-sdist:
    name: Rust Source Distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          working-directory: rust
          command: sdist
          args: --out dist

      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: dist-rust-sdist
          path: rust/dist/*.tar.gz

  # ---------------------------------------------------------------------------
  # Smoke test — verify Rust wheels load on each platform before publishing
  # ---------------------------------------------------------------------------
  smoke-test-rust:
    name: Smoke Test Rust (${{ matrix.os }}, Python ${{ matrix.python-version }})
    needs: [build-rust-linux, build-rust-macos, build-rust-windows]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.12"
            artifact: dist-rust-linux-x86_64-py3.12
          - os: ubuntu-latest
            python-version: "3.13"
            artifact: dist-rust-linux-x86_64-py3.13
          - os: macos-14
            python-version: "3.13"
            artifact: dist-rust-macos-aarch64-apple-darwin-py3.13
          - os: windows-latest
            python-version: "3.13"
            artifact: dist-rust-windows-py3.13
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Download wheel
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/

      - name: Install and verify
        run: |
          pip install dist/*.whl
          python -c "
          from django_matt._rust import HAS_RUST_EXTENSIONS, RadixRouter, jwt_encode, jwt_decode
          assert HAS_RUST_EXTENSIONS is True
          router = RadixRouter()
          router.insert('/test', 'handler')
          assert router.match('/test') == ('handler', {})
          token = jwt_encode({'sub': '1', 'exp': 9999999999}, 'secret', 'HS256')
          assert jwt_decode(token, 'secret', 'HS256')['sub'] == '1'
          print('Smoke test passed')
          "

  github-release:
    name: Create GitHub Release
    needs: [build-python, smoke-test-rust, build-rust-sdist]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist/
          merge-multiple: true

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.13

      - name: Extract changelog for this version
        id: changelog
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          uv run python -c "
          import re, sys
          text = open('CHANGELOG.md').read()
          pattern = re.compile(
              r'## \[' + re.escape('$VERSION') + r'\][^\n]*\n(.*?)(?=\n## \[|\Z)',
              re.DOTALL,
          )
          m = pattern.search(text)
          if m:
              print(m.group(1).strip())
          else:
              print('Release $VERSION')
          " > /tmp/release_notes.md
          cat /tmp/release_notes.md

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: /tmp/release_notes.md
          draft: false
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'rc') }}

  # ---------------------------------------------------------------------------
  # django-matt (pure Python) — TestPyPI then PyPI
  # ---------------------------------------------------------------------------
  testpypi-publish:
    name: Publish django-matt to TestPyPI
    needs: [build-python, smoke-test-rust]
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/django-matt
    permissions:
      id-token: write
    steps:
      - name: Download Python package
        uses: actions/download-artifact@v4
        with:
          name: dist-python
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  pypi-publish:
    name: Publish django-matt to PyPI
    needs: [testpypi-publish]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/django-matt
    permissions:
      id-token: write
    steps:
      - name: Download Python package
        uses: actions/download-artifact@v4
        with:
          name: dist-python
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  # ---------------------------------------------------------------------------
  # django-matt-rust (compiled wheels) — separate PyPI project
  # ---------------------------------------------------------------------------
  pypi-publish-rust:
    name: Publish django-matt-rust to PyPI
    needs: [smoke-test-rust, build-rust-sdist]
    runs-on: ubuntu-latest
    environment:
      name: pypi-rust
      url: https://pypi.org/p/django-matt-rust
    permissions:
      id-token: write
    steps:
      - name: Download Rust wheels
        uses: actions/download-artifact@v4
        with:
          pattern: dist-rust-*
          path: dist/
          merge-multiple: true

      - name: List artifacts
        run: ls -lh dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  docs-versioned:
    name: Deploy Versioned Docs
    needs: [pypi-publish, pypi-publish-rust]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - run: uv python install 3.13
      - run: uv sync --frozen

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # Derive the MAJOR.MINOR version from the tag (e.g. v0.9.3 -> 0.9) so the
      # alias is stable across patch releases. mike's version switcher surfaces
      # this in the dropdown; 'latest' always points at the newest MAJOR.MINOR.
      - name: Deploy versioned docs with mike
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          MAJOR_MINOR="${VERSION%.*}"
          uv run mike deploy --push --update-aliases "${MAJOR_MINOR}" latest
          uv run mike set-default --push latest

  # ---------------------------------------------------------------------------
  # Generated SDK publishing — TypeScript (npm), Python (PyPI), Swift (tarball)
  #
  # Runs after the main django-matt PyPI publish so every tag yields matching
  # client SDKs. Each SDK is built from the reference OpenAPI schema committed
  # at sdk-reference/openapi.json; update that file when the public API changes.
  # ---------------------------------------------------------------------------

  generate-sdks:
    name: Generate SDK Packages
    needs: [pypi-publish]
    runs-on: ubuntu-latest
    outputs:
      sdk-version: ${{ steps.derive.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - run: uv python install 3.13
      - run: uv sync --frozen

      - name: Derive SDK version from tag
        id: derive
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Generate TypeScript / Python / Swift SDKs
        run: |
          test -f sdk-reference/openapi.json || {
            echo "::error::sdk-reference/openapi.json missing — commit a reference schema to enable SDK publishing"; exit 1; }
          uv run python scripts/generate_sdks.py \
            --schema sdk-reference/openapi.json \
            --package django-matt-client \
            --version "${{ steps.derive.outputs.version }}" \
            --base-url https://api.example.com \
            --output dist/sdks

      - name: Upload SDK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: generated-sdks
          path: dist/sdks/**

  publish-ts-sdk:
    name: Publish TypeScript SDK to npm
    needs: [generate-sdks]
    runs-on: ubuntu-latest
    environment:
      name: npm
    steps:
      - name: Download SDK artifacts
        uses: actions/download-artifact@v4
        with:
          name: generated-sdks
          path: dist/sdks

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Publish to npm
        working-directory: dist/sdks/typescript
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm install --no-audit --no-fund
          npm run build --if-present
          npm publish --access public

  publish-py-sdk:
    name: Publish Python SDK to PyPI
    needs: [generate-sdks]
    runs-on: ubuntu-latest
    environment:
      name: pypi-sdk
      url: https://pypi.org/p/django-matt-client
    permissions:
      id-token: write
    steps:
      - name: Download SDK artifacts
        uses: actions/download-artifact@v4
        with:
          name: generated-sdks
          path: dist/sdks

      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - run: uv python install 3.13

      - name: Build Python SDK distribution
        working-directory: dist/sdks/python
        run: uv build --out-dir built-dist

      - name: Publish Python SDK to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/sdks/python/built-dist

  publish-swift-sdk:
    name: Attach Swift SDK to GitHub Release
    needs: [generate-sdks, github-release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download SDK artifacts
        uses: actions/download-artifact@v4
        with:
          name: generated-sdks
          path: dist/sdks

      # Swift doesn't have a central registry like npm/PyPI; SwiftPM consumes
      # packages by git URL + tag. We ship a tarball as a release asset and
      # document the git-URL install in the SDK's README.
      - name: Tar up Swift SDK
        working-directory: dist/sdks
        run: tar -czf swift-sdk-${{ needs.generate-sdks.outputs.sdk-version }}.tar.gz swift

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/sdks/swift-sdk-${{ needs.generate-sdks.outputs.sdk-version }}.tar.gz
