name: Architecture Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  architecture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - run: uv python install 3.12

      - run: uv sync --frozen

      - name: Run architecture check
        run: uv run python scripts/check_architecture.py --all
