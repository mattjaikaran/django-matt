[project]
name = "blog-api"
version = "1.0.0"
description = "Production-quality blog API built with django-matt"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Django Matt Team" }]

dependencies = [
    "django>=5.2",
    "django-matt",
    "psycopg[binary]>=3.1",
    "pillow>=10.0",
    "orjson>=3.9",
    "uvicorn[standard]>=0.27",
    "gunicorn>=21.0",
    "python-dotenv>=1.0.0",
    "markdown>=3.6",
    "bleach>=6.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-django>=4.8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "factory-boy>=3.3",
    "faker>=22.0",
    "httpx>=0.26",
    "ruff>=0.2",
    "mypy>=1.8",
    "django-stubs>=4.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["blog"]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0",
    "pytest-django>=4.8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "factory-boy>=3.3",
    "faker>=22.0",
    "httpx>=0.26",
    "ruff>=0.2",
    "mypy>=1.8",
    "django-stubs>=4.2",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
addopts = "-v --tb=short"
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main"]
strict = true

[tool.django-stubs]
django_settings_module = "config.settings"
