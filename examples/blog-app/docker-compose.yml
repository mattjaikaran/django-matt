services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: blog
      POSTGRES_USER: blog
      POSTGRES_PASSWORD: blog_secret
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blog"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ../..          # repo root — needed for local django-matt path dep
      dockerfile: examples/blog-app/api/Dockerfile
    environment:
      DEBUG: "True"
      SECRET_KEY: dev-secret-key
      ALLOWED_HOSTS: "localhost,127.0.0.1,api"
      DATABASE_URL: postgres://blog:blog_secret@db:5432/blog
      CORS_ALLOWED_ORIGINS: "http://localhost:3000"
      FRONTEND_URL: "http://localhost:3000"
      SITE_URL: "http://localhost:8000"
    ports:
      - "8000:8000"
    volumes:
      - ../../django_matt:/app/django_matt
      - ./api:/app/examples/blog-app/api
      - api_venv:/app/examples/blog-app/api/.venv
    command: ["sh", "-c", "uv run python manage.py migrate --noinput && uv run uvicorn config.asgi:application --host 0.0.0.0 --port 8000 --reload --reload-dir /app/django_matt --reload-dir /app/examples/blog-app/api"]
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    environment:
      VITE_API_BASE_URL: "http://localhost:8000/api"
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - api

volumes:
  postgres_data:
  api_venv:
  frontend_node_modules:
