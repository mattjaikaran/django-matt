[project]
name = "ecommerce-v2"
version = "1.0.0"
description = "Multi-vendor marketplace built with django-matt"
requires-python = ">=3.12"
dependencies = [
    "django>=5.2",
    "django-matt",
    "psycopg[binary]>=3.1.0",
    "python-dotenv>=1.0.0",
    "gunicorn>=22.0.0",
    "uvicorn[standard]>=0.30.0",
    "stripe>=8.0.0",
    "celery>=5.3.0",
    "redis>=5.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-django>=4.8.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.test_settings"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-x -q --tb=short"

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["**/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]
