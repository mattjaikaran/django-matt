[project]
name = "ai-chat"
version = "1.0.0"
description = "AI chat example with SSE streaming, CQRS, and LLM integration"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"

dependencies = [
    "django>=5.2",
    "django-matt>=0.1.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "orjson>=3.9",
    "httpx>=0.27",
    "uvicorn[standard]>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "ai_chat_project.settings"
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"
