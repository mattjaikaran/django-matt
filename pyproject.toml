[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "django-matt"
version = "0.1.0"
description = "A modern Django API framework with class-based views, async support, and developer experience tools"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Matt Jaikaran", email = "info@mattjaikaran.com" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Django",
    "Intended Audience :: Developers",
    # "License :: OSI Approved :: MIT License", # internal proprietary license not MIT
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "django>=5.2.0",
    "pydantic>=2.0.0",
    "typing-extensions>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.1.0",
    "pytest>=7.0.0",
    "pytest-django>=4.5.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "httpx>=0.27.0",
]
docs = [
    "mkdocs>=1.4.0",
    "mkdocs-material>=9.0.0",
]
ml = [
    "torch>=2.0.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
]
performance = [
    "orjson>=3.9.0",
    "ujson>=5.8.0",
    "msgpack>=1.0.5",
    "redis>=5.0.0",
]
# Authentication - JWT, password hashing
auth = [
    "PyJWT>=2.9.0",
    "passlib[bcrypt]>=1.7.4",
    "argon2-cffi>=23.1.0",
]
# OAuth providers
oauth = [
    "authlib>=1.3.0",
]
# Passkeys/WebAuthn
passkeys = [
    "webauthn>=2.1.0",
]
# Type generation
typegen = [
    "jinja2>=3.1.0",
]
# Testing utilities
testing = [
    "factory-boy>=3.3.0",
    "faker>=24.0.0",
    "pytest>=8.0.0",
    "pytest-django>=4.8.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
]
# Full install with everything
full = [
    "django-matt[auth,performance,typegen]",
]
all = [
    "django-matt[auth,oauth,passkeys,performance,typegen,testing,ml,docs]",
]

[project.urls]
Homepage = "https://github.com/mattjaikaran/django-matt"
Issues = "https://github.com/mattjaikaran/django-matt/issues"

[tool.ruff]
target-version = "py310"
line-length = 120
select = ["E", "F", "B", "I", "N", "UP", "ANN", "C4", "SIM", "ARG", "ERA"]
ignore = ["ANN101", "ANN102", "ANN401"]

[tool.ruff.isort]
known-first-party = ["django_matt"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
python_files = "test_*.py"
testpaths = ["tests"] 